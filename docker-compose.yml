services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docurag-api
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
    driver: local
